<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinGrade - Вход через Google</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .google-btn { background: #4285F4; transition: all 0.3s ease; }
        .google-btn:hover { background: #3367D6; transform: translateY(-2px); }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="app">
        <!-- Загрузка -->
        <div v-if="loading" class="fixed inset-0 bg-white bg-opacity-75 z-50 flex items-center justify-center">
            <div class="text-center">
                <div class="loading-spinner mx-auto mb-4"></div>
                <p class="text-gray-600">{{ loadingMessage }}</p>
            </div>
        </div>

        <!-- Шапка -->
        <nav class="gradient-bg text-white shadow-lg">
            <div class="container mx-auto px-4 py-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <i class="fas fa-chart-line text-2xl"></i>
                        <span class="text-xl font-bold">FinGrade</span>
                    </div>
                    <div v-if="currentUser" class="flex items-center space-x-3">
                        <span class="text-sm">{{ currentUser.nickname }}</span>
                        <button @click="logout" class="bg-red-500 px-3 py-1 rounded text-sm hover:bg-red-600">Выйти</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Сообщение -->
        <div v-if="message.show" :class="['fixed top-20 right-4 z-50 p-3 rounded shadow-lg text-white text-sm', 
            message.type === 'success' ? 'bg-green-500' : 'bg-red-500']" style="top: 80px;">
            {{ message.text }}
        </div>

        <!-- Форма входа -->
        <div v-if="!currentUser" class="container mx-auto px-4 py-8 max-w-md">
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h1 class="text-2xl font-bold text-center mb-6">FinGrade</h1>
                
                <!-- Кнопка Google - РАБОТАЕТ! -->
                <button @click="loginWithGoogle" 
                        class="google-btn w-full text-white py-3 rounded-lg font-semibold flex items-center justify-center space-x-2 mb-4">
                    <i class="fab fa-google text-xl"></i>
                    <span>Войти через Google</span>
                </button>
                
                <div class="text-center text-gray-400 text-sm my-4">или</div>
                
                <!-- Форма email/пароль -->
                <div class="space-y-3">
                    <input v-model="loginForm.login" type="text" placeholder="Логин или Email" class="w-full px-4 py-2 border rounded-lg">
                    <input v-model="loginForm.password" type="password" placeholder="Пароль" class="w-full px-4 py-2 border rounded-lg">
                    <button @click="handleLogin" class="gradient-bg w-full text-white py-2 rounded-lg">Войти</button>
                </div>
                
                <div class="text-center mt-4">
                    <button @click="showRegister = !showRegister" class="text-purple-600 text-sm">Зарегистрироваться</button>
                </div>
                
                <!-- Форма регистрации -->
                <div v-if="showRegister" class="mt-4 pt-4 border-t">
                    <h2 class="font-bold mb-3">Регистрация</h2>
                    <div class="space-y-2">
                        <input v-model="registerForm.name" type="text" placeholder="Имя" class="w-full px-4 py-2 border rounded-lg">
                        <input v-model="registerForm.surname" type="text" placeholder="Фамилия" class="w-full px-4 py-2 border rounded-lg">
                        <input v-model="registerForm.nickname" type="text" placeholder="Никнейм (@username)" class="w-full px-4 py-2 border rounded-lg">
                        <input v-model="registerForm.login" type="text" placeholder="Логин" class="w-full px-4 py-2 border rounded-lg">
                        <input v-model="registerForm.email" type="email" placeholder="Email" class="w-full px-4 py-2 border rounded-lg">
                        <input v-model="registerForm.password" type="password" placeholder="Пароль" class="w-full px-4 py-2 border rounded-lg">
                        <input v-model.number="registerForm.income" type="number" placeholder="Доход в месяц" class="w-full px-4 py-2 border rounded-lg">
                        <button @click="handleRegister" class="gradient-bg w-full text-white py-2 rounded-lg">Зарегистрироваться</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Основное приложение после входа -->
        <div v-else class="container mx-auto px-4 py-8 max-w-2xl">
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center space-x-4 mb-6">
                    <div class="w-16 h-16 rounded-full bg-purple-100 flex items-center justify-center">
                        <i class="fas fa-user text-3xl text-purple-600"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold">{{ currentUser.name }} {{ currentUser.surname }}</h2>
                        <p class="text-purple-600">{{ currentUser.nickname }}</p>
                        <p class="text-gray-500 text-sm">{{ currentUser.email }}</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-gray-50 p-4 rounded-lg text-center">
                        <p class="text-gray-600 text-sm">Доход</p>
                        <p class="text-2xl font-bold text-purple-600">{{ formatMoney(currentUser.income) }} ₽</p>
                        <button @click="editIncome" class="text-xs text-purple-500 mt-1">Изменить</button>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg text-center">
                        <p class="text-gray-600 text-sm">КФГ</p>
                        <p class="text-2xl font-bold text-purple-600">{{ kfg }}</p>
                    </div>
                </div>
                
                <button @click="logout" class="w-full bg-red-500 text-white px-4 py-3 rounded-lg font-semibold hover:bg-red-600">
                    Выйти
                </button>
            </div>
        </div>

        <!-- Модальное окно для изменения дохода -->
        <div v-if="showIncomeModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4">
                <h3 class="text-xl font-bold mb-4">Изменить доход</h3>
                <input v-model.number="newIncomeValue" type="number" class="w-full px-4 py-2 border rounded-lg mb-4">
                <div class="flex space-x-2">
                    <button @click="saveIncome" class="gradient-bg text-white px-6 py-2 rounded-lg flex-1">Сохранить</button>
                    <button @click="closeIncomeModal" class="bg-gray-300 px-6 py-2 rounded-lg flex-1">Отмена</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, computed, onMounted } = Vue;

        // Firebase конфигурация
        const firebaseConfig = {
            apiKey: "AIzaSyBoIf1-o2chwXIzWp7VBujZdqxqtYSu_4c",
            authDomain: "fingrade-f9eee.firebaseapp.com",
            projectId: "fingrade-f9eee",
            storageBucket: "fingrade-f9eee.firebasestorage.app",
            messagingSenderId: "492951301038",
            appId: "1:492951301038:web:96b425064787c88df7b63f"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        const app = createApp({
            setup() {
                const loading = ref(false);
                const loadingMessage = ref('');
                const currentUser = ref(null);
                const showRegister = ref(false);
                const showIncomeModal = ref(false);
                const newIncomeValue = ref(0);
                const message = reactive({ show: false, text: '', type: 'success' });
                
                const loginForm = reactive({ login: '', password: '' });
                const registerForm = reactive({
                    name: '', surname: '', nickname: '', login: '', email: '', password: '', income: 0
                });

                const kfg = computed(() => {
                    if (!currentUser.value) return 0;
                    let value = 50;
                    if (currentUser.value.income > 30000) value += 20;
                    if (currentUser.value.income > 50000) value += 15;
                    if (currentUser.value.income > 100000) value += 15;
                    return Math.min(100, value);
                });

                function showMessage(text, type) {
                    message.text = text;
                    message.type = type;
                    message.show = true;
                    setTimeout(() => { message.show = false; }, 3000);
                }

                function formatMoney(amount) {
                    return new Intl.NumberFormat('ru-RU').format(amount || 0);
                }

                // Вход через Google
                async function loginWithGoogle() {
                    loading.value = true;
                    loadingMessage.value = 'Открываем Google...';
                    
                    try {
                        const result = await auth.signInWithPopup(googleProvider);
                        const user = result.user;
                        
                        const emailQuery = await db.collection('users').where('email', '==', user.email).get();
                        
                        if (!emailQuery.empty) {
                            const userDoc = emailQuery.docs[0];
                            currentUser.value = { ...userDoc.data(), login: userDoc.id };
                            showMessage('Добро пожаловать!', 'success');
                        } else {
                            const baseLogin = user.email.split('@')[0].replace(/[^a-zA-Z0-9]/g, '');
                            let login = baseLogin;
                            let counter = 1;
                            while (true) {
                                const check = await db.collection('users').doc(login).get();
                                if (!check.exists) break;
                                login = `${baseLogin}${counter}`;
                                counter++;
                            }
                            
                            const newUser = {
                                name: user.displayName?.split(' ')[0] || 'Пользователь',
                                surname: user.displayName?.split(' ').slice(1).join(' ') || '',
                                nickname: '@' + baseLogin,
                                login: login,
                                email: user.email,
                                income: 0,
                                avatar: 1,
                                expenses: {},
                                goals: [],
                                friends: [],
                                createdAt: new Date().toISOString()
                            };
                            
                            await db.collection('users').doc(login).set(newUser);
                            currentUser.value = newUser;
                            showMessage('Профиль создан!', 'success');
                        }
                    } catch (error) {
                        console.error(error);
                        showMessage('Ошибка: ' + error.message, 'error');
                    } finally {
                        loading.value = false;
                    }
                }

                // Обычный вход
                async function handleLogin() {
                    if (!loginForm.login || !loginForm.password) {
                        showMessage('Заполните все поля', 'error');
                        return;
                    }
                    loading.value = true;
                    try {
                        const userDoc = await db.collection('users').doc(loginForm.login).get();
                        if (!userDoc.exists) {
                            showMessage('Пользователь не найден', 'error');
                            return;
                        }
                        const userData = userDoc.data();
                        await auth.signInWithEmailAndPassword(userData.email, loginForm.password);
                        currentUser.value = { ...userData, login: loginForm.login };
                        showMessage('Добро пожаловать!', 'success');
                        loginForm.login = '';
                        loginForm.password = '';
                    } catch (error) {
                        showMessage('Неверный логин или пароль', 'error');
                    } finally {
                        loading.value = false;
                    }
                }

                // Регистрация
                async function handleRegister() {
                    if (!registerForm.name || !registerForm.surname || !registerForm.nickname || 
                        !registerForm.login || !registerForm.email || !registerForm.password) {
                        showMessage('Заполните все поля', 'error');
                        return;
                    }
                    loading.value = true;
                    try {
                        const loginCheck = await db.collection('users').doc(registerForm.login).get();
                        if (loginCheck.exists) {
                            showMessage('Логин уже существует', 'error');
                            return;
                        }
                        const nicknameQuery = await db.collection('users').where('nickname', '==', registerForm.nickname).get();
                        if (!nicknameQuery.empty) {
                            showMessage('Никнейм уже существует', 'error');
                            return;
                        }
                        
                        await auth.createUserWithEmailAndPassword(registerForm.email, registerForm.password);
                        
                        const newUser = {
                            name: registerForm.name,
                            surname: registerForm.surname,
                            nickname: registerForm.nickname,
                            login: registerForm.login,
                            email: registerForm.email,
                            income: Number(registerForm.income) || 0,
                            avatar: 1,
                            expenses: {},
                            goals: [],
                            friends: [],
                            createdAt: new Date().toISOString()
                        };
                        
                        await db.collection('users').doc(registerForm.login).set(newUser);
                        currentUser.value = newUser;
                        showMessage('Регистрация успешна!', 'success');
                        
                        registerForm.name = '';
                        registerForm.surname = '';
                        registerForm.nickname = '';
                        registerForm.login = '';
                        registerForm.email = '';
                        registerForm.password = '';
                        registerForm.income = 0;
                        showRegister.value = false;
                    } catch (error) {
                        showMessage('Ошибка: ' + error.message, 'error');
                    } finally {
                        loading.value = false;
                    }
                }

                async function logout() {
                    loading.value = true;
                    try {
                        await auth.signOut();
                        currentUser.value = null;
                        showMessage('Вы вышли', 'success');
                    } catch (error) {
                        showMessage('Ошибка', 'error');
                    } finally {
                        loading.value = false;
                    }
                }

                function editIncome() {
                    newIncomeValue.value = currentUser.value.income;
                    showIncomeModal.value = true;
                }

                function closeIncomeModal() {
                    showIncomeModal.value = false;
                }

                async function saveIncome() {
                    loading.value = true;
                    try {
                        await db.collection('users').doc(currentUser.value.login).update({
                            income: newIncomeValue.value
                        });
                        currentUser.value.income = newIncomeValue.value;
                        showMessage('Доход обновлен!', 'success');
                        closeIncomeModal();
                    } catch (error) {
                        showMessage('Ошибка', 'error');
                    } finally {
                        loading.value = false;
                    }
                }

                onMounted(() => {
                    loading.value = true;
                    auth.onAuthStateChanged(async (user) => {
                        if (user) {
                            const emailQuery = await db.collection('users').where('email', '==', user.email).get();
                            if (!emailQuery.empty) {
                                const userDoc = emailQuery.docs[0];
                                currentUser.value = { ...userDoc.data(), login: userDoc.id };
                            }
                        }
                        loading.value = false;
                    });
                });

                return {
                    loading,
                    loadingMessage,
                    currentUser,
                    showRegister,
                    showIncomeModal,
                    newIncomeValue,
                    message,
                    loginForm,
                    registerForm,
                    kfg,
                    formatMoney,
                    loginWithGoogle,
                    handleLogin,
                    handleRegister,
                    logout,
                    editIncome,
                    closeIncomeModal,
                    saveIncome
                };
            }
        });
        
        app.mount('#app');
    </script>
</body>
</html>
