                // Проверка на экстремальные значения

            const filteredExpenses = Vue.computed(() => {

            // Формула КФГ для пользователя
            function calculateKFG(user) {
                if (!user?.income || user.income <= 0) return 0;
                
                // Проверяем, есть ли расходы
                const userExpenses = user.expenses || {};
                const hasAnyExpenses = Object.values(userExpenses).some(val => val > 0);
                if (!hasAnyExpenses) {
                    return 0;
                }
                
                const totalUserExpenses = Object.values(userExpenses).reduce((a, b) => a + b, 0);
                
                // Если расходы экстремально превышают доход, возвращаем 0
                if (totalUserExpenses > user.income * 1000) {
                    return 0;
                }
                
                let value = 100 - (totalUserExpenses / user.income * 100);
                
                // Штрафы (только если расходы не сильно превышают доход)
                if (totalUserExpenses <= user.income * 10) {
                    const totalFood = (userExpenses.food || 0) + (userExpenses.cafe || 0);
                    if (userExpenses.entertainment > user.income * 0.3) value -= 20;
                    if (totalFood > user.income * 0.5) value -= 15;
                    if (userExpenses.subscriptions > user.income * 0.1) value -= 10;
                }
                
                // Бонусы (только если расходы не превышают доход)
                if (totalUserExpenses <= user.income) {
                    if (userExpenses.education > 0) value += 5;
                    if ((user.income - totalUserExpenses) > user.income * 0.2) value += 10;
                }
                
                // Ограничиваем значение от 0 до 100
                return Math.max(0, Math.min(100, Math.round(value)));
            }

                    return {

            function formatMoney(amount) {
                if (amount > 1e12) return '> 1 трлн';
                if (amount > 1e9) return Math.round(amount / 1e9) + ' млрд';
                if (amount > 1e6) return Math.round(amount / 1e6) + ' млн';
                if (amount < 0 && Math.abs(amount) > 1e12) return '< -1 трлн';
                return new Intl.NumberFormat('ru-RU').format(amount);

            function getMonthWord(months) {
                if (months % 10 === 1 && months % 100 !== 11) {
                    return 'месяц';
                } else if ([2, 3, 4].includes(months % 10) && ![12, 13, 14].includes(months % 100)) {
                    return 'месяца';

                    targetAmount: newGoal.targetAmount,

                newGoal.targetAmount = 0;

                showAddToGoalModal.value = false;
                selectedGoalIndex.value = null;
                selectedGoalName.value = '';
                addToGoalAmount.value = 1000;

                if (selectedGoalIndex.value === null) return;
                
                if (addToGoalAmount.value <= 0) {
                    showMessage('Введите корректную сумму', 'error');
                    return;

                if (addToGoalAmount.value > 1e9) {
                    showMessage('Слишком большая сумма (максимум 1 млрд)', 'error');
                    return;

                goals.value[selectedGoalIndex.value].currentAmount += addToGoalAmount.value;
                saveToSupabase();
                showMessage(`Добавлено ${formatMoney(addToGoalAmount.value)} ₽ к цели!`, 'success');
                closeAddToGoalModal();

                if (amount > 1e9) {
                    showMessage('Слишком большая сумма', 'error');

                saveToSupabase();
                showMessage(`Добавлено ${formatMoney(amount)} ₽ к цели!`, 'success');

                selectedGoalNameForRemove.value = goals.value[index].name;

            const recommendations = Vue.computed(() => {

                const recs = [];
                
                if (totalExpenses.value > currentUser.value.income) {

                }
                
                if (totalExpenses.value > currentUser.value.income * 10) {
                    recs.push('🔥 Критическое превышение расходов! КФГ принудительно установлен в 0.');
                }
                
                if (expenses.entertainment > currentUser.value.income * 0.2 && totalExpenses.value <= currentUser.value.income) {
                    recs.push('🎯 Попробуйте сократить расходы на развлечения до 20% от дохода.');
                }
                
                const totalFood = (expenses.food || 0) + (expenses.cafe || 0);
                if (totalFood > currentUser.value.income * 0.3 && totalExpenses.value <= currentUser.value.income) {
                    recs.push('🍎 Готовьте дома чаще - это сэкономит до 50% на еде и кафе.');

            // ===== МЕТОДЫ ДЛЯ SUPABASE =====
            
            // Загрузка всех пользователей из Supabase
            async function loadUsersFromSupabase() {
                isLoading.value = true;
                try {
                    const { data, error } = await supabase
                        .from('users')
                        .select('*');
                    
                    if (error) throw error;
                    
                    if (data && data.length > 0) {
                        users.value = data;
                        console.log('Загружено пользователей из Supabase:', users.value.length);
                    } else {
                        console.log('Нет пользователей в Supabase, создаем тестовых');
                        await createTestUsers();
                    }
                } catch (error) {
                    console.error('Ошибка загрузки из Supabase:', error);
                    showMessage('Ошибка загрузки данных из облака', 'error');
                    // Пробуем загрузить из localStorage как запасной вариант
                    loadFromLocalStorage();
                } finally {
                    isLoading.value = false;
                }
            }

            // Сохранение всех пользователей в Supabase
            async function saveToSupabase() {
                if (!users.value.length) return;
                
                isLoading.value = true;
                try {
                    // Удаляем всех существующих пользователей
                    const { error: deleteError } = await supabase
                        .from('users')
                        .delete()
                        .neq('login', 'dummy');
                    
                    if (deleteError) {
                        console.warn('Ошибка при очистке:', deleteError);
                    }
                    
                    // Вставляем обновленных пользователей
                    const { error } = await supabase
                        .from('users')
                        .insert(users.value);
                    
                    if (error) throw error;
                    
                    console.log('Данные сохранены в Supabase');
                    
                    // Также сохраняем в localStorage как запасной вариант
                    saveToLocalStorage();
                } catch (error) {
                    console.error('Ошибка сохранения в Supabase:', error);
                    showMessage('Ошибка сохранения в облако, данные сохранены локально', 'warning');
                    // Сохраняем в localStorage как запасной вариант
                    saveToLocalStorage();
                } finally {
                    isLoading.value = false;
                }
            }

            // Сохранение в localStorage (запасной вариант)
            function saveToLocalStorage() {
                const data = {
                    users: users.value,
                    currentUser: currentUser.value
                };
                localStorage.setItem('fingrade_backup', JSON.stringify(data));
            }

            // Загрузка из localStorage (запасной вариант)
            function loadFromLocalStorage() {
                const saved = localStorage.getItem('fingrade_backup');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        users.value = data.users || [];
                        if (data.currentUser) {
                            currentUser.value = data.currentUser;
                            loadUserData(currentUser.value);
                        }
                        console.log('Загружено из localStorage');
                    } catch (e) {
                        console.error('Ошибка загрузки из localStorage', e);
                    }
                }
            }

            // Методы авторизации с Supabase
            async function handleRegister() {
                if (!registerForm.name || !registerForm.surname || !registerForm.nickname || 
                    !registerForm.login || !registerForm.password || !registerForm.income) {
                    showMessage('Пожалуйста, заполните все поля', 'error');
                    return;
                }
                
                if (registerForm.income > 1e9) {
                    showMessage('Слишком большой доход (максимум 1 млрд)', 'error');
                    return;
                }
                
                // Сначала загружаем актуальных пользователей
                await loadUsersFromSupabase();
                
                if (users.value.some(u => u.login === registerForm.login)) {
                    showMessage('Пользователь с таким логином уже существует', 'error');
                    return;
                }
                
                if (users.value.some(u => u.nickname === registerForm.nickname)) {
                    showMessage('Пользователь с таким никнеймом уже существует', 'error');
                    return;
                }
                
                if (registerForm.avatar !== 1) {
                    showMessage('При регистрации доступен только аватар "Новичок"', 'error');
                    registerForm.avatar = 1;
                    return;
                }
                
                const hasExpenses = Object.values(registerForm.expenses).some(val => val > 0);
                if (!hasExpenses) {
                    showMessage('Заполните хотя бы одну категорию расходов', 'error');
                    return;
                }
                
                // Проверка на огромные расходы
                const totalRegExpenses = Object.values(registerForm.expenses).reduce((a, b) => a + b, 0);
                if (totalRegExpenses > 1e9) {
                    showMessage('Слишком большие расходы (максимум 1 млрд)', 'error');
                    return;
                }
                
                const newUser = {
                    name: registerForm.name,
                    surname: registerForm.surname,
                    nickname: registerForm.nickname,
                    login: registerForm.login,
                    password: registerForm.password,
                    income: Number(registerForm.income),
                    avatar: registerForm.avatar,
                    expenses: { ...registerForm.expenses },
                    goals: [],
                    friends: [],
                    friendRequests: [],
                    pendingRequests: []
                };
                
                users.value.push(newUser);
                
                // Сохраняем в Supabase
                await saveToSupabase();
                
                currentUser.value = { ...newUser };
                
                Object.assign(expenses, registerForm.expenses);
                
                showMessage('Регистрация успешна!', 'success');
                
                registerForm.name = '';
                registerForm.surname = '';
                registerForm.nickname = '';
                registerForm.login = '';
                registerForm.password = '';
                registerForm.income = 0;
                registerForm.avatar = 1;
                Object.assign(registerForm.expenses, initialExpenses);

                    !friends.value.some(f => f.login === u.login) &&

                ).map(u => ({

            async function sendFriendRequest(user) {
                if (!friendRequests.value.includes(user.login)) {
                    friendRequests.value.push(user.login);
                }
                
                const targetUserIndex = users.value.findIndex(u => u.login === user.login);
                if (targetUserIndex !== -1) {
                    if (!users.value[targetUserIndex].pendingRequests) {
                        users.value[targetUserIndex].pendingRequests = [];
                    }
                    if (!users.value[targetUserIndex].pendingRequests.includes(currentUser.value.login)) {
                        users.value[targetUserIndex].pendingRequests.push(currentUser.value.login);
                    }
                }
                
                const currentUserIndex = users.value.findIndex(u => u.login === currentUser.value?.login);
                if (currentUserIndex !== -1) {
                    users.value[currentUserIndex].friendRequests = [...friendRequests.value];
                }
                
                searchResults.value = [];
                friendSearchQuery.value = '';
                searchPerformed.value = false;
                
                await saveToSupabase();
                showMessage(`Заявка в друзья отправлена пользователю ${user.name}`, 'success');
            }
            
            async function acceptFriendRequest(request) {
                const newFriend = {
                    name: request.name,
                    surname: request.surname,
                    nickname: request.nickname,
                    login: request.login,
                    avatar: request.avatar
                };
                
                friends.value.push(newFriend);
                
                pendingRequests.value = pendingRequests.value.filter(login => login !== request.login);
                
                const senderIndex = users.value.findIndex(u => u.login === request.login);
                if (senderIndex !== -1) {
                    if (!users.value[senderIndex].friends) {
                        users.value[senderIndex].friends = [];
                    }
                    users.value[senderIndex].friends.push({
                        name: currentUser.value.name,
                        surname: currentUser.value.surname,
                        nickname: currentUser.value.nickname,
                        login: currentUser.value.login,
                        avatar: currentUser.value.avatar
                    });
                    
                    if (users.value[senderIndex].friendRequests) {
                        users.value[senderIndex].friendRequests = 
                            users.value[senderIndex].friendRequests.filter(login => login !== currentUser.value.login);
                    }
                }
                
                const currentUserIndex = users.value.findIndex(u => u.login === currentUser.value?.login);
                if (currentUserIndex !== -1) {
                    users.value[currentUserIndex].friends = [...friends.value];
                    users.value[currentUserIndex].pendingRequests = [...pendingRequests.value];
                }
                
                await saveToSupabase();
                showMessage(`Вы приняли заявку в друзья от ${request.name}`, 'success');
            }
            
            async function rejectFriendRequest(request) {
                pendingRequests.value = pendingRequests.value.filter(login => login !== request.login);
                
                const senderIndex = users.value.findIndex(u => u.login === request.login);
                if (senderIndex !== -1 && users.value[senderIndex].friendRequests) {
                    users.value[senderIndex].friendRequests = 
                        users.value[senderIndex].friendRequests.filter(login => login !== currentUser.value.login);
                }
                
                const currentUserIndex = users.value.findIndex(u => u.login === currentUser.value?.login);
                if (currentUserIndex !== -1) {
                    users.value[currentUserIndex].pendingRequests = [...pendingRequests.value];
                }
                
                await saveToSupabase();
                showMessage(`Заявка от ${request.name} отклонена`, 'info');
            }
            
            async function removeFriend(friend) {
                friends.value = friends.value.filter(f => f.login !== friend.login);
                
                const friendIndex = users.value.findIndex(u => u.login === friend.login);
                if (friendIndex !== -1 && users.value[friendIndex].friends) {
                    users.value[friendIndex].friends = 
                        users.value[friendIndex].friends.filter(f => f.login !== currentUser.value.login);
                }
                
                const currentUserIndex = users.value.findIndex(u => u.login === currentUser.value?.login);
                if (currentUserIndex !== -1) {
                    users.value[currentUserIndex].friends = [...friends.value];
                }
                
                showMessage(`Друг ${friend.name} удален`, 'success');
                await saveToSupabase();
            }

            function initChart() {
                if (currentTab.value !== 'analytics' || !hasExpenses.value) {
                    return;
                }
                
                Vue.nextTick(() => {
                    const canvas = document.getElementById('expenseChart');
                    if (!canvas) {
                        console.log('Canvas not found, retrying...');
                        setTimeout(initChart, 100);
                        return;
                    }
                    
                    if (chart) {
                        chart.destroy();
                        chart = null;
                    }
                    
                    const activeCategories = {};
                    Object.keys(filteredExpenses.value).forEach(key => {
                        if (filteredExpenses.value[key] > 0) {
                            activeCategories[key] = filteredExpenses.value[key];
                        }
                    });
                    
                    if (Object.keys(activeCategories).length === 0) {
                        return;
                    }
                    
                    const labels = Object.keys(activeCategories).map(key => categoryNames[key]);
                    const data = Object.values(activeCategories);
                    const colors = Object.keys(activeCategories).map(key => categoryColors[key]);
                    
                    try {
                        chart = new Chart(canvas.getContext('2d'), {
                            type: 'doughnut',
                            data: {
                                labels: labels,
                                datasets: [{
                                    data: data,
                                    backgroundColor: colors,
                                    borderWidth: 1,
                                    borderColor: '#ffffff'
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { 
                                        position: 'bottom',
                                        labels: {
                                            boxWidth: 12,
                                            padding: 15,
                                            font: {
                                                size: 11
                                            }
                                        }
                                    },
                                    tooltip: {
                                        callbacks: {
                                            label: function(context) {
                                                const label = context.label || '';
                                                const value = context.raw || 0;
                                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                                const percentage = Math.round((value / total) * 100);
                                                return `${label}: ${formatMoney(value)} ₽ (${percentage}%)`;
                                            }
                                        }
                                    }
                                }
                            }
                        });
                    } catch (error) {
                        console.error('Error initializing chart:', error);
                    }
                });
            }

                    exportDate: new Date().toISOString()
                };
                
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `financial_data_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                
                showMessage('Данные экспортированы!', 'success');
            }
            
            Vue.onMounted(async () => {
                // Загружаем пользователей из Supabase при старте
                await loadUsersFromSupabase();
                
                setTimeout(() => {
                    if (currentTab.value === 'analytics' && hasExpenses.value) {
                        initChart();
                    }
                }, 200);
            });
            
            Vue.watch([expenses, goals, friends, friendRequests, pendingRequests], async () => {
                if (currentUser.value) {
                    await saveToSupabase();
                }
            }, { deep: true });

            Vue.watch(kfg, (newKfg, oldKfg) => {
                if (currentUser.value && oldKfg !== undefined && newKfg !== oldKfg) {
                    const currentAvatar = avatars.find(a => a.id === currentUser.value.avatar);
                    if (currentAvatar && !isAvatarUnlocked(currentAvatar)) {
                        changeAvatar(avatars[0]);
                        showMessage(`Ваш аватар изменен на Новичок, так как предыдущий стал недоступен`, 'info');
                    }
                }
            });

            Vue.watch(currentTab, (newTab) => {
                if (newTab === 'analytics' && hasExpenses.value) {
                    setTimeout(() => {
                        initChart();
                    }, 100);
                }
            });
            
            return {
                currentTab,
                message,
                currentUser,
                loginForm,
                registerForm,
                expenses,
                goals,
                newGoal,
                friends,
                friendRequests,
                pendingRequests,

                chartContainer,

                foodPercent,

                subscriptionsPercent,
                balancePercent,
                kfgCalculation,
                totalGoalsAmount,
                totalSaved,
                kfg,
                recommendations,
                unlockedAvatars,
                friendsWithDetails,
                ratingParticipants,
                showIncomeModal,
                newIncomeValue,
                filteredExpenses,
                showAddToGoalModal,
                selectedGoalName,
                addToGoalAmount,
                showRemoveGoalModal,
                selectedGoalNameForRemove,
                isLoading,
                handleRegister,
                handleLogin,
                logout,
                searchFriends,
                sendFriendRequest,
                acceptFriendRequest,
                rejectFriendRequest,
                removeFriend,
                saveExpenses,
                addGoal,
                openAddToGoalModal,
                closeAddToGoalModal,

                openRemoveGoalModal,

                calculateKFG,

            };
        }
    });
