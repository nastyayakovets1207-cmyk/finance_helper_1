<!DOCTYPE html>
<html>
<head>
    <title>FinGrade - Вход через Google</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        body { text-align: center; padding: 50px; font-family: sans-serif; background: #f0f2f5; }
        button { 
            background: #4285F4; 
            color: white; 
            border: none; 
            padding: 15px 40px; 
            font-size: 18px; 
            border-radius: 8px; 
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { background: #3367D6; }
        #status { margin-top: 30px; padding: 15px; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🔐 FinGrade</h1>
    <p>Нажмите кнопку для входа через Google</p>
    
    <button onclick="loginWithGoogle()">
        🔵 Войти через Google
    </button>
    
    <div id="status"></div>

    <script>
        // Firebase настройки
        const firebaseConfig = {
            apiKey: "AIzaSyBoIf1-o2chwXIzWp7VBujZdqxqtYSu_4c",
            authDomain: "fingrade-f9eee.firebaseapp.com",
            projectId: "fingrade-f9eee",
            storageBucket: "fingrade-f9eee.firebasestorage.app",
            messagingSenderId: "492951301038",
            appId: "1:492951301038:web:96b425064787c88df7b63f"
        };

        // Инициализация
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        async function loginWithGoogle() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '🔄 Открываем окно Google...';
            statusDiv.className = '';
            
            try {
                // Это откроет окно Google
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                statusDiv.innerHTML = `
                    ✅ Успешно!<br>
                    Email: ${user.email}<br>
                    Имя: ${user.displayName}
                `;
                statusDiv.className = 'success';
                
            } catch (error) {
                statusDiv.innerHTML = `❌ Ошибка: ${error.message}`;
                statusDiv.className = 'error';
                console.error(error);
            }
        }
    </script>
</body>
</html>
