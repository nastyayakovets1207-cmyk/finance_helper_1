<!DOCTYPE html>
<html>
<head>
    <title>Тест входа Google</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f5f5f5; }
        button { padding: 15px 30px; font-size: 18px; background: #4285F4; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px; }
        button:hover { background: #3367D6; }
        #status { margin-top: 20px; padding: 15px; border-radius: 8px; max-width: 500px; margin: 20px auto; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>🔐 FinGrade</h1>
    <p>Тест входа через Google</p>
    
    <button onclick="loginWithGoogle()">
        🟢 Войти через Google
    </button>
    
    <div id="status"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBoIf1-o2chwXIzWp7VBujZdqxqtYSu_4c",
            authDomain: "fingrade-f9eee.firebaseapp.com",
            projectId: "fingrade-f9eee",
            storageBucket: "fingrade-f9eee.firebasestorage.app",
            messagingSenderId: "492951301038",
            appId: "1:492951301038:web:96b425064787c88df7b63f"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        const statusDiv = document.getElementById('status');
        
        // Проверка окружения
        if (window.location.protocol === 'file:') {
            statusDiv.innerHTML = '⚠️ Файл открыт локально. Для работы Firebase нужно открыть через http:// или https://<br><br>👉 Используйте ссылку: <strong>https://nastyayakovets1207-cmyk.github.io/finance_helper_1/test.html</strong>';
            statusDiv.className = 'info';
        }

        async function loginWithGoogle() {
            statusDiv.innerHTML = '🔄 Подключение...';
            statusDiv.className = '';
            
            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                statusDiv.innerHTML = `
                    ✅ <strong>Успешно!</strong><br><br>
                    📧 Email: ${user.email}<br>
                    👤 Имя: ${user.displayName || 'Не указано'}<br>
                    🆔 ID: ${user.uid}
                `;
                statusDiv.className = 'success';
                console.log('Пользователь:', user);
                
            } catch (error) {
                console.error('Ошибка:', error);
                let errorMessage = '';
                if (error.code === 'auth/unauthorized-domain') {
                    errorMessage = 'Домен не авторизован. Нужно добавить localhost или ваш домен в Firebase Console.';
                } else if (error.code === 'auth/operation-not-allowed') {
                    errorMessage = 'Google Sign-In не включен в Firebase Console. Включите его в Authentication → Sign-in methods.';
                } else {
                    errorMessage = error.message;
                }
                
                statusDiv.innerHTML = `
                    ❌ <strong>Ошибка:</strong> ${error.code}<br>
                    ${errorMessage}
                `;
                statusDiv.className = 'error';
            }
        }
    </script>
</body>
</html>
